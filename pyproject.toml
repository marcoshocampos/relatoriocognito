[project]
name = "relatoriocognito"
version = "0.1.0"
description = "Gerador de relatório PDF de tempo de reação/decisão de atletas a partir de CSVs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "reportlab>=4.2",
    "customtkinter>=5.2",
]

[project.scripts]
relatoriocognito = "relatoriocognito.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relatoriocognito"]

[tool.pytest.ini_options]
testpaths = ["tests"]
